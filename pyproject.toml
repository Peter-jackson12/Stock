[project]
name = "stock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "finance-datareader>=0.9.202",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "pyarrow>=25.0.1",
    "pykrx>=1.0.0",
    # pykrx imports pkg_resources; retain the previously working runtime.
    "setuptools==80.10.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0",
    "requests>=2.0.0",
    "streamlit[auth]>=1.62.0",
    "websockets>=16.1.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not local_data and not local_env'"
markers = [
    "local_data: 로컬 시장 데이터/LOB 기준선 필요; 명시적 실행 시 누락은 실패",
    "local_env: 별도 로컬 32비트 Python 필요; 명시적 실행 시 누락은 실패",
]
