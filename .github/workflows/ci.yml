name: FID chain independent failure audit

# 감사 전용 branch: full CI를 대체하는 병합 후보가 아니다. push 중복 실행 없음.
on:
  pull_request:
    branches: [audit/fid-read-aba-run-plan-20260923]

permissions:
  contents: read

concurrency:
  group: fid-chain-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  failure-injection:
    name: Frozen PR28 fail-closed audit (synthetic only)
    runs-on: windows-latest
    timeout-minutes: 8
    env:
      PYTHONUTF8: "1"
      AUDIT_SOURCE: c156108c269ffec55fc1bf7c843397d56781f112
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Confirm frozen production source
        run: |
          git rev-parse HEAD
          git diff --exit-code $env:AUDIT_SOURCE HEAD -- collector scripts engine control_tower
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.12.5"
          python-version: "3.14"
          enable-cache: false
      - name: Install existing locked environment
        run: uv sync --locked --group dev --python 3.14
      - name: Assert independent safety contracts (failures remain failures)
        timeout-minutes: 2
        run: |
          uv run --locked --offline python -m pytest -q -s --tb=line -ra tests/test_fid_chain_fail_closed_audit.py --junitxml="$env:RUNNER_TEMP/fid-chain-audit.xml"
          exit $LASTEXITCODE
      - name: Summarize actual audit outcomes
        if: always()
        run: |
          $p = "$env:RUNNER_TEMP/fid-chain-audit.xml"
          if (Test-Path -LiteralPath $p) {
            [xml]$j = Get-Content -LiteralPath $p -Raw
            $s = $j.testsuites.testsuite
            Write-Output ("AUDIT_COUNTS tests=" + $s.tests + " failures=" + $s.failures + " errors=" + $s.errors + " skipped=" + $s.skipped)
          } else {
            Write-Output "AUDIT_COUNTS unavailable: no completed pytest report"
          }
