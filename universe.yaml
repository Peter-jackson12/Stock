# universe.yaml — 백테스트 유니버스 단일 소스 (Phase B-4)
#
# ARCHITECTURE_V2.md §3.6.1 '추가 발견': engine.py 가 날짜도 종목도 open.csv 에서
# 뽑는 바람에, 일봉 매트릭스가 거시 '필터'의 입력이 아니라 종목이 백테스트에
# 보이느냐를 결정하는 **게이트** 역할을 하고 있었다. 그 결과 유니버스가 계층마다
# 달랐다 — LOB 1,300~1,500 / fs_v1 200 / 엔진 3.
#
# 이 파일의 목적은 유니버스를 넓히는 것이 아니라 **좁아지는 것을 보이게 만드는 것**이다.
# 무엇이 후보였는지 여기에 적어두면, 런이 끝날 때 "선언 200 → 처리 3, no_daily 197"
# 처럼 대조 결과가 매니페스트에 남는다. 지금까지는 그냥 3 이라고만 적혔다.
#
# 선언 방식 (source)
#   explicit       codes 에 적은 종목만
#   rule           시장 구분 + 보통주 여부로 규칙 선언 (원천: sampledata/Daily/key.csv)
#   daily_matrix   일봉 매트릭스에 있는 종목 — 기존 암묵 동작을 '명시적으로' 고른 것
#   feature_store  피처 파일에 실제로 들어 있는 종목
#   lob            대상 기간 LOB DB 에 수집된 종목 전체
#
# 사용:
#   uv run python -m engine.main --universe sample_200
#   uv run python -m engine.main --universe collected --strict-universe

version: "1.0"

# 기본값은 daily_matrix — 지금까지의 동작과 같다. 유니버스를 넓히는 것은
# 별개 작업(B-4 의 짝: daily_collector 수정)이고, 그 전에 결과가 바뀌면 안 된다.
default: daily_matrix

universes:

  daily_matrix:
    source: daily_matrix
    description: >
      일봉 매트릭스(open.csv)에 있는 종목. 기존 엔진의 암묵적 유니버스와 같지만,
      이제는 '고른 것'이지 '그렇게 되어버린 것'이 아니다. 현재 샘플에서는 3종목.

  sample_200:
    source: feature_store
    feature_set: fs_v1
    description: >
      fs_v1 이 실제로 담고 있는 200종목 (build_features.py --limit 200 의 결과).
      일봉 매트릭스가 3종목뿐인 상태에서 이걸 선언하면 no_daily 가 197 로 잡힌다
      — 계층 간 격차를 눈으로 보는 용도.

  collected:
    source: lob
    description: >
      대상 기간 LOB DB 에 실제로 수집된 종목 전체 (샘플 기준 1,300~1,500).
      '수집한 것'과 '백테스트한 것'의 격차를 그대로 드러낸다.

  kospi_kosdaq_common:
    source: rule
    market: [KOSPI, KOSDAQ]
    common_only: true
    description: >
      코스피 + 코스닥 보통주 전체. 운영 목표 유니버스.
      보통주 판별은 종목코드 끝자리 0 (우선주는 5/7/9/K/L/M) — key.csv 에 별도
      구분 컬럼이 없어 한국 시장 관행을 쓴다.

  blue_chips:
    source: explicit
    codes: ["000270", "000660", "005930"]
    description: >
      명시 목록 예시. 회귀 대조처럼 '정확히 이 종목들' 이 필요할 때 쓴다.
